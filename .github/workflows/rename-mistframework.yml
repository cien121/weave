name: Rename mistframework AAR
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename AAR preserving binary content
        run: |
          ls -l app/libs/
          git config user.name "cien121"
          git config user.email "cien121@users.noreply.github.com"
          git mv app/libs/mistframework-aar-v5.aar app/libs/mistframework.aar
          ls -l app/libs/
          git commit -m "Rename mistframework-aar-v5.aar to mistframework.aar"
          git push
